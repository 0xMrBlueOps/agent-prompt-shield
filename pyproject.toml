[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-prompt-shield"
version = "0.1.2"
description = "Deterministic prompt-injection guardrail for tool-using agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Agent Prompt Shield Contributors" }]
keywords = ["agent", "security", "prompt-injection", "llm", "guardrail"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.scripts]
agent-prompt-shield = "agent_prompt_shield.cli:main"
agent-redlab = "agent_prompt_shield.redlab_command:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_prompt_shield*"]

[tool.setuptools.package-data]
agent_prompt_shield = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/run_benchmarks.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
packages = ["agent_prompt_shield"]
strict = true
warn_unreachable = true
show_error_codes = true

[tool.bandit]
exclude_dirs = ["build", "dist", "tests", ".venv", "venv"]
skips = ["B101"]
